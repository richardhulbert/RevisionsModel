name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      # composer.lock is not committed, so this resolves the newest
      # dependencies the constraints allow - what a fresh install gets
      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
